<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Expiry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
<div class="container">

  <div class="top-bar">
    <div class="title-group">
      <h1 id="appTitle">Smart Expiry</h1>
      <p id="appSubtitle">
        Track, reduce waste, and get smart recipe suggestions
      </p>
    </div>

    <div class="lang-wrapper">
      <span class="lang-icon" onclick="toggleLang()">🌐</span>
      <div id="langMenu" class="lang-menu hidden">
        <div onclick="selectLang('en')">English</div>
        <div onclick="selectLang('hi')">हिंदी</div>
        <div onclick="selectLang('te')">తెలుగు</div>
      </div>
    </div>
  </div>
  <!-- ADD PRODUCT -->
  <div class="card">
    <h2 id="addProductTitle">Add Product</h2>

    <label id="productNameLabel">Product Name</label>
    <div class="input-wrapper">
      <input id="name" placeholder="Product name (required)">
      <span class="mic-icon" onclick="startVoice()">🎤</span>
    </div>

    <div class="row">
      <select id="category">
        <option value="">Category (optional)</option>
        <option>Dairy</option>
        <option>Fruits</option>
        <option>Vegetables</option>
        <option>Grains</option>
        <option>Medicine</option>
      </select>

      <input id="price" type="number" placeholder="Price ₹ (optional)">
    </div>

    <div class="row">
      <input id="quantity" type="number" placeholder="Quantity (required)">
      <select id="unit">
        <option value="">Unit (required)</option>
        <option>kg</option>
        <option>pcs</option>
        <option>liters</option>
        <option>ml</option>
      </select>
    </div>

    <input id="expiry" type="date" aria-label="Expiry Date" title="Select expiry date">
    <button id="addBtn" onclick="addProduct()">Add</button>
  </div>

  <!-- INVENTORY -->
  <div class="card">
    <h2 id="inventoryTitle">Inventory</h2>

    <!-- IN-APP ALERTS -->
    <div id="alerts" class="alerts"></div>

    <ul id="inventory"></ul>
  </div>

</div>

<!-- FLOATING CALENDAR BUTTON -->
<div class="calendar-fab" onclick="downloadAllReminders()" title="Add expiring items to calendar">
  📅
</div>

<!-- RECIPE FAB -->
<div class="recipe-fab" onclick="showRecipes()" title="Get Recipe Ideas">
  🍳
</div>

<!-- RECIPE MODAL -->
<div id="recipeModal" class="modal hidden">
  <div class="modal-content">
    <h3 id="recipeTitle">Recipe Ideas</h3>
    <div id="manualSelect"></div>
    <div id="recipeList"></div>
    <button onclick="closeRecipes()">Close</button>
  </div>
</div>

<script src="script.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/smart-expiry/service-worker.js");
  }
</script>
</body>
</html>
